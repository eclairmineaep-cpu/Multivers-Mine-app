name: Creation des Applications
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      # --- FABRICATION WINDOWS ---
      - name: Creer le fichier PC (.exe)
        run: |
          mkdir win-app && cd win-app
          npm init -y
          npm install electron electron-builder --save-dev
          cp -r ../* . || true
          echo "const { app, BrowserWindow } = require('electron'); app.whenReady().then(() => { const win = new BrowserWindow({ width: 1200, height: 800, autoHideMenuBar: true }); win.loadFile('index.html'); });" > main.js
          echo '{"name": "app", "version": "1.0.0", "main": "main.js", "scripts": { "build": "electron-builder --win nsis" }, "build": { "appId": "com.app.id", "win": { "target": "nsis" }, "files": ["**/*"] }}' > package.json
          npm run build

      # --- FABRICATION ANDROID ---
      - name: Creer le fichier Mobile (.apk)
        run: |
          mkdir android-app && cd android-app && mkdir www
          cp -r ../* www/ || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init MonApp com.app.id --web-dir=www
          npx cap add android
          cd android && ./gradlew assembleDebug

      # --- TOUT METTRE EN TÉLÉCHARGEMENT ---
      - name: Publier les applications
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Télécharger mon application"
          files: |
            win-app/dist/*.exe
            android-app/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
